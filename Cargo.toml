[package]
name = "rustafits"
version = "1.0.1"
edition = "2021"
authors = ["Vilen Sharifov <vilen.sharifov@gmail.com>"]
description = "High-performance FITS to JPEG converter for astronomical images with auto-stretch and Bayer debayering"
license = "Apache-2.0"
repository = "https://github.com/eg013ra1n/rustafits"
homepage = "https://github.com/eg013ra1n/rustafits"
documentation = "https://github.com/eg013ra1n/rustafits#readme"
readme = "README.md"
keywords = ["astronomy", "fits", "image-processing", "converter", "astrophotography"]
categories = ["multimedia::images", "science", "command-line-utilities"]

[lib]
name = "astroimage"
path = "src/lib.rs"

[[bin]]
name = "rustafits"
path = "src/bin/rustafits.rs"

[[bin]]
name = "rustafits-debug"
path = "src/bin/debug.rs"
required-features = ["debug-pipeline"]

[features]
debug-pipeline = []

[dependencies]
anyhow = "1.0"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
lz4_flex = { version = "0.14", default-features = false, features = ["safe-decode"] }
ruzstd = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
# Pure-Rust libjpeg-turbo reimplementation with NEON on aarch64 and AVX2/SSE2 on
# x86_64, plus scalar fallbacks. Replaces the `turbojpeg` C binding: same
# baseline/4:2:0 output contract and comparable speed, but no cmake/nasm build
# step, so `cargo install rustafits`, cross-compilation and distro packaging need
# nothing but the Rust toolchain. Pinned exactly — the crate is young and pre-1.0,
# so a minor bump gets reviewed rather than picked up silently.
# NOTE: `simd` is a DEFAULT feature — never add `default-features = false` here or
# every SIMD path (NEON/AVX2) silently falls back to scalar.
# 0.8.0 is the first release we build on: it carries the fix for the 4:2:0
# trailing-MCU divergence we reported upstream (see docs/libjpeg-turbo-rs-issue.md).
libjpeg-turbo-rs = "=0.8.0"
quick-xml = "0.41"
base64 = "0.23"
rayon = "1.10"
nalgebra = "0.35"
tracing = "0.1"

[dev-dependencies]
# Independent decoder for tests/jpeg_encoder.rs. Deliberately NOT the encoder's
# own decode side: a symmetric bug there would pass a self-round-trip.
jpeg-decoder = { version = "0.3", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
