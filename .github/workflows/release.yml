name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      # The tag must name the version in Cargo.toml, or crates.io would get another version than the release.
      - name: Check the tag against Cargo.toml
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$version" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The release notes are the version's CHANGELOG.md section: from its `## [X.Y.Z]` heading to the next `## [`.
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v head="## [$VERSION]" '
            index($0, head) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      # A re-run of the workflow edits the release it made the first time.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "rustafits $VERSION" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "rustafits $VERSION" --notes-file notes.md
          fi

  build-binaries:
    needs: create-release
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package binary
        run: |
          cd target/release
          tar czf rustafits-linux-x86_64.tar.gz rustafits
          mv rustafits-linux-x86_64.tar.gz ${{ github.workspace }}/

      - name: Generate SHA256 checksum
        run: |
          sha256sum rustafits-linux-x86_64.tar.gz > rustafits-linux-x86_64.tar.gz.sha256

      - name: Upload the binary and its checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber \
            rustafits-linux-x86_64.tar.gz rustafits-linux-x86_64.tar.gz.sha256

  build-deb:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build with cargo
        run: |
          cargo build --release

      - name: Create .deb package manually
        run: |
          mkdir -p debian-pkg/usr/bin
          cp target/release/rustafits debian-pkg/usr/bin/

          mkdir -p debian-pkg/DEBIAN
          cat > debian-pkg/DEBIAN/control <<EOF
          Package: rustafits
          Version: ${{ needs.create-release.outputs.version }}
          Section: science
          Priority: optional
          Architecture: amd64
          Maintainer: Vilen Sharifov <vilen.sharifov@gmail.com>
          Description: High-performance FITS/XISF to JPEG converter
           FITS/XISF to JPEG converter for astronomical images with PixInsight STF-
           compatible auto-stretch and Bayer debayering. Pure Rust, no C dependencies.
          EOF

          dpkg-deb --build debian-pkg
          mv debian-pkg.deb rustafits-${{ needs.create-release.outputs.version }}-amd64.deb

      - name: Upload .deb to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber \
            rustafits-${{ needs.create-release.outputs.version }}-amd64.deb

  publish-crates-io:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # A failed publish fails the job (it used to pass silently). A re-run skips a version crates.io already has.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          if curl -sf -A "rustafits-release (github.com/${{ github.repository }})" \
              "https://crates.io/api/v1/crates/rustafits/$VERSION" > /dev/null; then
            echo "::notice::rustafits $VERSION is already on crates.io; nothing to publish"
          else
            cargo publish
          fi
